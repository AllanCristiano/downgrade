server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    # Java / Spring Boot (mantem o prefixo /api)
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python / FastAPI (remove o prefixo /tools)
    location ^~ /tools/ {
        proxy_pass http://tools:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build do Angular (nome com hash, ex: main-AB12CD34.js): cache longo
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets do jogo (mapas, sprites, fundos) mudam sem trocar de nome: sempre revalidar
    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
